name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile with JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: mikutag-jar
          retention-days: 1
          path: build/libs/MikuTag-*.jar
          if-no-files-found: error

      - name: Resolve release info
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "title=MikuTag ${VER}" >> "$GITHUB_OUTPUT"
          # 版本规则（大版本.正式版.测试版）：第三位 > 0 视为测试版（预发布），= 0 为正式版
          PATCH="${VER##*.}"
          case "$PATCH" in
            0) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          files: build/libs/MikuTag-*.jar
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true