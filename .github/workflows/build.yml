name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile with JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP '^version=\K\S+' gradle.properties)
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG 与 gradle.properties 的 version=$VER 不一致" >&2
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: mikutag-jar
          retention-days: 1
          path: build/libs/MikuTag-*.jar
          if-no-files-found: error

      - name: Resolve release info
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "title=MikuTag ${VER}" >> "$GITHUB_OUTPUT"
          # 版本规则：第三位 = 0 为正式版，发 Release；> 0 为测试版，只留 Actions 产物
          PATCH="${VER##*.}"
          case "$PATCH" in
            0) echo "release=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "release=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Render release notes from release commit
        if: startsWith(github.ref, 'refs/tags/') && steps.rel.outputs.release == 'true'
        run: |
          # 更新日志取自发版提交正文（正文即结构化更新日志）
          git log -1 --format=%b "$GITHUB_SHA" > release_body.md
          if ! grep -q '[^[:space:]]' release_body.md; then
            echo "发版提交正文为空：请按规范填写结构化更新日志" >&2
            exit 1
          fi

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          body_path: release_body.md
          files: build/libs/MikuTag-*.jar